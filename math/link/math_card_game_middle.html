<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중학교 수학 카드 뒤집기 게임</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Malgun Gothic', sans-serif;
  background: radial-gradient(ellipse at top, #0d1b2a 0%, #080c14 60%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
}

.screen { display: none; }
.screen.active { display: block; }

/* ── GRADE SELECT ── */
#s-grade {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
}

.main-title {
  font-size: 2.2rem;
  font-weight: 900;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.main-sub { color: #6a85b0; text-align: center; margin-bottom: 48px; font-size: 0.95rem; }

.grade-cards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }

.grade-card {
  width: 230px;
  padding: 36px 24px 28px;
  border-radius: 22px;
  cursor: pointer;
  text-align: center;
  border: 2px solid transparent;
  transition: transform .22s, box-shadow .22s;
  position: relative;
  overflow: hidden;
}

.grade-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.08) 0%, transparent 70%);
}

.grade-card:hover { transform: translateY(-8px); }

.gc1 { background: linear-gradient(145deg,#002d4a,#0066a0); border-color: #00b4d8; box-shadow: 0 8px 30px rgba(0,180,216,.3); }
.gc1:hover { box-shadow: 0 14px 44px rgba(0,180,216,.5); }
.gc2 { background: linear-gradient(145deg,#163326,#256b45); border-color: #43c97e; box-shadow: 0 8px 30px rgba(67,201,126,.3); }
.gc2:hover { box-shadow: 0 14px 44px rgba(67,201,126,.5); }
.gc3 { background: linear-gradient(145deg,#25094a,#5d17a0); border-color: #a66cff; box-shadow: 0 8px 30px rgba(166,108,255,.3); }
.gc3:hover { box-shadow: 0 14px 44px rgba(166,108,255,.5); }

.gc-icon { font-size: 3.2rem; margin-bottom: 14px; }
.gc-name { font-size: 1.45rem; font-weight: bold; margin-bottom: 10px; }
.gc-desc { font-size: 0.78rem; color: rgba(255,255,255,.65); line-height: 1.7; }
.gc-badge {
  display: inline-block; margin-top: 14px;
  font-size: 0.72rem; font-weight: bold;
  padding: 3px 12px; border-radius: 12px;
  background: rgba(255,255,255,.15);
}

/* ── UNIT SELECT ── */
#s-unit { padding: 28px 20px 48px; max-width: 880px; margin: 0 auto; }

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border: 1px solid rgba(255,255,255,.25);
  border-radius: 24px; background: rgba(255,255,255,.07);
  color: rgba(255,255,255,.7); cursor: pointer;
  font-size: 0.88rem; font-family: inherit;
  transition: all .18s; margin-bottom: 28px;
}
.back-btn:hover { border-color: rgba(255,255,255,.6); color: #fff; background: rgba(255,255,255,.12); }

.section-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 6px; }
.section-sub { color: #6a85b0; font-size: 0.88rem; margin-bottom: 26px; }

.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 16px; }

.unit-btn {
  padding: 22px 18px; border-radius: 16px;
  border: 2px solid transparent; cursor: pointer;
  text-align: left; font-family: inherit;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  position: relative; background: none;
}
.unit-btn:hover { transform: translateY(-4px); }

.ub1 { background: linear-gradient(145deg,#002d4a88,#0066a088); border-color: #00b4d855; }
.ub1:hover { border-color: #00b4d8; box-shadow: 0 8px 28px rgba(0,180,216,.35); }
.ub2 { background: linear-gradient(145deg,#16332688,#256b4588); border-color: #43c97e55; }
.ub2:hover { border-color: #43c97e; box-shadow: 0 8px 28px rgba(67,201,126,.35); }
.ub3 { background: linear-gradient(145deg,#25094a88,#5d17a088); border-color: #a66cff55; }
.ub3:hover { border-color: #a66cff; box-shadow: 0 8px 28px rgba(166,108,255,.35); }

.ub-icon { font-size: 1.9rem; margin-bottom: 10px; }
.ub-name { font-size: 1.05rem; font-weight: bold; color: #fff; }
.ub-count { font-size: 0.76rem; color: rgba(255,255,255,.55); margin-top: 5px; }
.ub-best {
  position: absolute; top: 12px; right: 14px;
  font-size: 0.68rem; background: rgba(255,210,0,.18);
  color: #ffd200; border-radius: 10px; padding: 2px 9px;
}

/* ── GAME SCREEN ── */
#s-game { padding: 20px 16px 40px; max-width: 940px; margin: 0 auto; }

.game-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.game-title { font-size: 1.25rem; font-weight: bold; flex: 1; }
.grade-badge { font-size: 0.8rem; padding: 4px 14px; border-radius: 14px; font-weight: bold; }

.stats-bar {
  display: flex; align-items: center;
  gap: 0; margin-bottom: 18px;
  background: rgba(255,255,255,.05);
  border-radius: 14px; overflow: hidden;
}

.stat-block { text-align: center; padding: 12px 20px; border-right: 1px solid rgba(255,255,255,.08); }
.stat-val { font-size: 1.5rem; font-weight: bold; color: #ffd200; line-height: 1; }
.stat-lbl { font-size: 0.68rem; color: #6a85b0; margin-top: 3px; }

.progress-wrap { flex: 1; padding: 0 20px; }
.progress-track { height: 9px; background: rgba(255,255,255,.1); border-radius: 5px; overflow: hidden; }
.progress-fill  { height: 100%; border-radius: 5px; background: linear-gradient(90deg,#f7971e,#ffd200); width: 0%; transition: width .4s ease; }
.progress-label { font-size: 0.72rem; color: #6a85b0; margin-top: 5px; text-align: right; }

/* ── CARDS ── */
#board { display: grid; gap: 10px; }

.card { perspective: 900px; cursor: pointer; height: 112px; }

.card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .42s cubic-bezier(.4,2,.55,.9);
  border-radius: 13px;
}
.card.flipped .card-inner,
.card.matched .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute; inset: 0; border-radius: 13px;
  backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 8px; user-select: none;
}

.card-front {
  background: linear-gradient(145deg, #151e30, #1e2d48);
  border: 2px solid #2a3f60;
  font-size: 2rem; color: #3a5a90;
}

.card-back { transform: rotateY(180deg); font-weight: bold; line-height: 1.38; }

.card-back.term {
  font-size: 1rem;
  background: linear-gradient(145deg, #0a5e5e, #0c9e84);
  border: 2px solid #14c9a0; color: #fff;
}
.card-back.def {
  font-size: 0.71rem;
  background: linear-gradient(145deg, #3a0d66, #6b27b5);
  border: 2px solid #9b5de5; color: #f0e6ff;
}

.card.matched .card-back {
  border-color: #ffd200 !important;
  box-shadow: 0 0 20px rgba(255,210,0,.55);
}

.card.wrong .card-inner { animation: shake .38s ease; }

@keyframes shake {
  0%,100% { transform: rotateY(180deg) translateX(0); }
  30%      { transform: rotateY(180deg) translateX(-9px); }
  70%      { transform: rotateY(180deg) translateX(9px); }
}

/* ── MODAL ── */
#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.72);
  display: flex; align-items: center; justify-content: center; z-index: 300;
}
#modal[hidden] { display: none; }

.modal-box {
  background: linear-gradient(145deg, #0d1520, #172035);
  border: 2px solid #ffd200;
  border-radius: 26px; padding: 38px 48px;
  text-align: center; width: 90%; max-width: 380px;
  box-shadow: 0 0 60px rgba(255,210,0,.3);
  animation: popIn .32s cubic-bezier(.4,2,.55,.9);
}

@keyframes popIn { from { transform: scale(.55); opacity:0; } to { transform: scale(1); opacity:1; } }

.modal-box h2 { font-size: 1.9rem; color: #ffd200; margin-bottom: 6px; }
.modal-stars  { font-size: 2.2rem; margin: 8px 0; }
.modal-grade-msg { font-size: 1.1rem; font-weight: bold; color: #fff; margin: 8px 0 14px; }
.modal-stat   { font-size: 0.95rem; color: #99aac0; margin: 5px 0; }
.modal-best   { font-size: 0.9rem; color: #ffd200; margin-top: 8px; }

.modal-btns { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.mbtn {
  padding: 11px 22px; border: none; border-radius: 26px;
  font-size: 0.92rem; cursor: pointer; font-family: inherit; font-weight: bold;
  transition: transform .15s;
}
.mbtn:hover { transform: scale(1.06); }
.mbtn-primary   { background: linear-gradient(90deg,#f7971e,#ffd200); color: #111; }
.mbtn-secondary { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); color: #fff; }
.mbtn-tertiary  { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); color: rgba(255,255,255,.7); }

/* Color helpers */
.c1 { color: #00b4d8; } .c2 { color: #43c97e; } .c3 { color: #a66cff; }
.bg1 { background: linear-gradient(90deg,#0077b6,#00b4d8); }
.bg2 { background: linear-gradient(90deg,#256b45,#43c97e); }
.bg3 { background: linear-gradient(90deg,#5d17a0,#a66cff); }

@media (max-width: 580px) {
  .grade-cards { flex-direction: column; align-items: center; }
  .grade-card  { width: 90%; max-width: 320px; }
  #board { grid-template-columns: repeat(3, 1fr) !important; }
  .card  { height: 95px; }
  .card-back.term { font-size: 0.83rem; }
  .card-back.def  { font-size: 0.63rem; }
  .stat-block { padding: 10px 12px; }
  .stat-val   { font-size: 1.2rem; }
  .modal-box  { padding: 28px 24px; }
}
</style>
</head>
<body>

<!-- ══ SCREEN 1: 학년 선택 ══ -->
<div id="s-grade" class="screen active">
  <div style="position:fixed;top:16px;left:16px;z-index:100;">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:5px;padding:7px 15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;font-weight:700;transition:all .18s;"
       onmouseover="this.style.background='rgba(255,255,255,.2)'" onmouseout="this.style.background='rgba(255,255,255,.12)'">← 수학 목록</a>
  </div>
  <div class="main-title">📐 중학교 수학 카드 게임</div>
  <div class="main-sub">학년을 선택하고 수학 용어와 정의를 짝 맞추세요!</div>
  <div class="grade-cards">
    <div class="grade-card gc1" onclick="selectGrade(1)">
      <div class="gc-icon">📘</div>
      <div class="gc-name">중학교 1학년</div>
      <div class="gc-desc">소인수분해 · 정수와 유리수<br>문자와 식 · 일차방정식<br>좌표와 그래프 · 기본 도형</div>
      <div class="gc-badge">6개 단원 · 36쌍</div>
    </div>
    <div class="grade-card gc2" onclick="selectGrade(2)">
      <div class="gc-icon">📗</div>
      <div class="gc-name">중학교 2학년</div>
      <div class="gc-desc">유리수와 순환소수 · 식의 계산<br>연립방정식 · 일차함수<br>도형의 성질 · 확률</div>
      <div class="gc-badge">6개 단원 · 36쌍</div>
    </div>
    <div class="grade-card gc3" onclick="selectGrade(3)">
      <div class="gc-icon">📙</div>
      <div class="gc-name">중학교 3학년</div>
      <div class="gc-desc">제곱근과 실수 · 인수분해<br>이차방정식 · 이차함수<br>삼각비 · 통계</div>
      <div class="gc-badge">6개 단원 · 36쌍</div>
    </div>
  </div>
</div>

<!-- ══ SCREEN 2: 단원 선택 ══ -->
<div id="s-unit" class="screen">
  <div style="max-width:880px;margin:0 auto;padding:28px 20px 48px;">
    <button class="back-btn" onclick="goGrade()">← 학년 선택</button>
    <div id="unit-grade-title" class="section-title"></div>
    <div class="section-sub">학습할 단원을 선택하세요</div>
    <div id="unit-grid" class="unit-grid"></div>
  </div>
</div>

<!-- ══ SCREEN 3: 게임 ══ -->
<div id="s-game" class="screen">
  <div style="max-width:940px;margin:0 auto;padding:20px 16px 48px;">
    <div class="game-header">
      <button class="back-btn" onclick="goUnit()">← 단원 선택</button>
      <div class="game-title" id="game-title"></div>
      <span class="grade-badge" id="grade-badge"></span>
    </div>
    <div class="stats-bar">
      <div class="stat-block">
        <div class="stat-val" id="v-moves">0</div>
        <div class="stat-lbl">시도 횟수</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="v-match">0/6</div>
        <div class="stat-lbl">매칭 성공</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="v-time">0</div>
        <div class="stat-lbl">경과(초)</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
        <div class="progress-label" id="prog-label">0 / 6 쌍</div>
      </div>
    </div>
    <div id="board"></div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div id="modal" hidden>
  <div class="modal-box">
    <h2>🎉 완료!</h2>
    <div id="m-stars" class="modal-stars"></div>
    <div id="m-msg"   class="modal-grade-msg"></div>
    <div id="m-moves" class="modal-stat"></div>
    <div id="m-time"  class="modal-stat"></div>
    <div id="m-best"  class="modal-best"></div>
    <div class="modal-btns">
      <button class="mbtn mbtn-primary"    onclick="restartGame()">🔄 다시 풀기</button>
      <button class="mbtn mbtn-secondary"  onclick="nextUnit()">다음 단원 →</button>
      <button class="mbtn mbtn-tertiary"   onclick="goUnitFromModal()">📋 단원 목록</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  DATA — 학년별 단원별 용어 데이터
// ════════════════════════════════════════
const DATA = {
  1: {
    fullName: '중학교 1학년', cls: 1,
    units: [
      { name: '소인수분해', icon: '🔢', pairs: [
        { term: '소수 (素數)',     def: '1과 자기 자신만을\n약수로 갖는 자연수\n예) 2, 3, 5, 7, 11' },
        { term: '합성수 (合成數)', def: '1보다 크고 소수가\n아닌 자연수\n예) 4, 6, 8, 9, 10' },
        { term: '거듭제곱',       def: '같은 수를 여러 번 곱한 것\n2³=2×2×2=8\na의 n제곱: aⁿ' },
        { term: '소인수분해',     def: '자연수를 소수의 곱으로\n나타내는 것\n예) 12 = 2² × 3' },
        { term: '최대공약수',     def: '두 수의 공약수 중\n가장 큰 수\n예) 12와 18의 최대공약수=6' },
        { term: '최소공배수',     def: '두 수의 공배수 중\n가장 작은 수\n예) 4와 6의 최소공배수=12' },
      ]},
      { name: '정수와 유리수', icon: '🔢', pairs: [
        { term: '양의 정수',      def: '+1, +2, +3, ...\n자연수와 같음\n수직선의 0 오른쪽' },
        { term: '음의 정수',      def: '−1, −2, −3, ...\n수직선의 0 왼쪽' },
        { term: '정수 (整數)',    def: '양의 정수, 0, 음의 정수를\n통틀어 이르는 말' },
        { term: '유리수 (有理數)',def: 'a/b (b≠0) 꼴로 나타낼\n수 있는 수\n예) 1/2, −3, 0.25' },
        { term: '절댓값 |a|',    def: '수직선에서 원점으로부터\n어떤 수까지의 거리\n|−3|=3, |3|=3' },
        { term: '역수 (逆數)',    def: '곱해서 1이 되는 수\n예) 2/3의 역수=3/2\na×(역수)=1' },
      ]},
      { name: '문자와 식', icon: '✏️', pairs: [
        { term: '변수 (變數)',    def: '여러 값을 가질 수 있는\n문자\n예) x, y, a, b' },
        { term: '계수 (係數)',    def: '항에서 문자에 곱해진 수\n예) 3x에서 계수=3\n−2y에서 계수=−2' },
        { term: '차수 (次數)',    def: '항에서 문자가 곱해진 횟수\n예) x²의 차수=2\nx³y의 차수=4' },
        { term: '단항식 (單項式)',def: '수 또는 문자의 곱으로만\n이루어진 식\n예) 3x, −2a², 5' },
        { term: '다항식 (多項式)',def: '두 개 이상의 항의\n합으로 이루어진 식\n예) x²+3x−5' },
        { term: '동류항 (同類項)',def: '문자와 차수가 같은 항\n3x와 −5x는 동류항\n합쳐서 계산 가능' },
      ]},
      { name: '일차방정식', icon: '⚖️', pairs: [
        { term: '방정식 (方程式)',def: 'x 값에 따라 참·거짓이\n결정되는 등식\n예) 2x+1=5' },
        { term: '항등식 (恒等式)',def: 'x에 어떤 값을 넣어도\n항상 참인 등식\n예) x+x=2x' },
        { term: '해 / 근 (根)',  def: '방정식을 참으로\n만드는 x의 값\n2x+1=5 → x=2' },
        { term: '이항 (移項)',   def: '등식의 항을 부호를\n바꾸어 반대 변으로\n이동하는 것' },
        { term: '등식의 성질',   def: 'a=b이면\na±c=b±c, a×c=b×c\n(c≠0이면 a÷c=b÷c)' },
        { term: '일차방정식',    def: '미지수의 최고 차수가\n1인 방정식\nax+b=0 (a≠0)' },
      ]},
      { name: '좌표와 그래프', icon: '📈', pairs: [
        { term: '순서쌍',        def: '두 수를 순서를 정해\n쌍으로 나타낸 것\n예) (3, −2)' },
        { term: '좌표축',        def: '수직으로 만나는 두 수직선\nx축 (가로), y축 (세로)' },
        { term: '사분면 (四分面)',def: '좌표축이 나눈 네 영역\n제1사분면: x>0, y>0\n제3사분면: x<0, y<0' },
        { term: '함수 (函數)',   def: 'x값 하나에 y값이\n하나씩 대응하는 관계\ny=f(x)' },
        { term: '함숫값',        def: 'x=a일 때 대응하는 y 값\nf(a)로 표현\n예) f(x)=2x, f(3)=6' },

// ════════════════════════════════════════
//  STATE
// ════════════════════════════════════════
let curGrade  = null;
let curUnitIdx = null;
let flipped   = [];
let matched   = 0;
let moves     = 0;
let locked    = false;
let timerID   = null;
let seconds   = 0;

// ════════════════════════════════════════
//  SCREEN NAVIGATION
// ════════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectGrade(g) {
  curGrade = g;
  const gd = DATA[g];
  const titleEl = document.getElementById('unit-grade-title');
  titleEl.textContent = gd.fullName + ' — 단원 선택';
  titleEl.className = 'section-title c' + gd.cls;

  const grid = document.getElementById('unit-grid');
  grid.innerHTML = '';
  gd.units.forEach((u, i) => {
    const best = getBest(g, i);
    const btn = document.createElement('button');
    btn.className = 'unit-btn ub' + gd.cls;
    btn.innerHTML = `
      <div class="ub-icon">${u.icon}</div>
      <div class="ub-name">${u.name}</div>
      <div class="ub-count">카드 ${u.pairs.length * 2}장 (${u.pairs.length}쌍)</div>
      ${best !== null ? `<div class="ub-best">⭐ 최고 ${best}회</div>` : ''}
    `;
    btn.onclick = () => selectUnit(i);
    grid.appendChild(btn);
  });
  show('s-unit');
}

function goGrade() { stopTimer(); show('s-grade'); }

function selectUnit(idx) {
  curUnitIdx = idx;
  const gd = DATA[curGrade];
  const u  = gd.units[idx];

  document.getElementById('game-title').textContent = u.name;
  const badge = document.getElementById('grade-badge');
  badge.textContent = gd.fullName.replace('중학교 ', '중');
  badge.className = 'grade-badge bg' + gd.cls;

  show('s-game');
  startGame();
}

function goUnit() { stopTimer(); show('s-unit'); }
function goUnitFromModal() {
  document.getElementById('modal').hidden = true;
  stopTimer(); show('s-unit');
}

function nextUnit() {
  document.getElementById('modal').hidden = true;
  const units = DATA[curGrade].units;
  const next  = (curUnitIdx + 1) % units.length;
  selectUnit(next);
}

// ════════════════════════════════════════
//  GAME
// ════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  stopTimer();
  const pairs = DATA[curGrade].units[curUnitIdx].pairs;
  matched = 0; moves = 0; flipped = []; locked = false; seconds = 0;

  document.getElementById('v-moves').textContent = 0;
  document.getElementById('v-match').textContent = `0/${pairs.length}`;
  document.getElementById('v-time').textContent  = 0;
  document.getElementById('prog').style.width    = '0%';
  document.getElementById('prog-label').textContent = `0 / ${pairs.length} 쌍`;

  const cards = shuffle([
    ...pairs.map((p, id) => ({ id, type: 'term', text: p.term })),
    ...pairs.map((p, id) => ({ id, type: 'def',  text: p.def  })),
  ]);

  const board = document.getElementById('board');
  board.innerHTML = '';
  // 6쌍=12장 → 4열 3행
  board.style.gridTemplateColumns = 'repeat(4, 1fr)';

  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id   = c.id;
    el.dataset.type = c.type;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-front">🧮</div>
        <div class="card-back ${c.type}">${c.text.replace(/\n/g, '<br>')}</div>
      </div>`;
    el.addEventListener('click', () => onFlip(el));
    board.appendChild(el);
  });

  startTimer();
}

function onFlip(el) {
  if (locked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length >= 2) return;
  el.classList.add('flipped');
  flipped.push(el);
  if (flipped.length === 2) { moves++; document.getElementById('v-moves').textContent = moves; locked = true; checkPair(); }
}

function checkPair() {
  const [a, b] = flipped;
  const isMatch = a.dataset.id === b.dataset.id && a.dataset.type !== b.dataset.type;
  if (isMatch) {
    setTimeout(() => {
      a.classList.add('matched'); b.classList.add('matched');
      matched++;
      const total = DATA[curGrade].units[curUnitIdx].pairs.length;
      document.getElementById('v-match').textContent = `${matched}/${total}`;
      document.getElementById('prog').style.width = `${(matched / total) * 100}%`;
      document.getElementById('prog-label').textContent = `${matched} / ${total} 쌍`;
      flipped = []; locked = false;
      if (matched === total) onClear();
    }, 500);
  } else {
    a.classList.add('wrong'); b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      flipped = []; locked = false;
    }, 950);
  }
}

function onClear() {
  stopTimer();
  const total = DATA[curGrade].units[curUnitIdx].pairs.length;
  saveBest(curGrade, curUnitIdx, moves);
  const best = getBest(curGrade, curUnitIdx);
  const ratio = moves / total;
  let stars, msg;
  if      (ratio <= 1.2) { stars = '⭐⭐⭐'; msg = '완벽한 기억력!'; }
  else if (ratio <= 1.8) { stars = '⭐⭐';   msg = '훌륭합니다!'; }
  else                   { stars = '⭐';     msg = '한 번 더 도전!'; }

  document.getElementById('m-stars').textContent = stars;
  document.getElementById('m-msg').textContent   = msg;
  document.getElementById('m-moves').textContent = `🖱 시도 횟수: ${moves}회`;
  document.getElementById('m-time').textContent  = `⏱ 소요 시간: ${seconds}초`;
  document.getElementById('m-best').textContent  = best === moves ? '🏆 신기록 달성!' : `📌 최고 기록: ${best}회`;
  document.getElementById('modal').hidden = false;
}

function restartGame() {
  document.getElementById('modal').hidden = true;
  startGame();
}

// ════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════
function startTimer() {
  timerID = setInterval(() => {
    seconds++;
    document.getElementById('v-time').textContent = seconds;
  }, 1000);
}
function stopTimer() { clearInterval(timerID); timerID = null; }

// ════════════════════════════════════════
//  BEST SCORE (localStorage)
// ════════════════════════════════════════
function bKey(g, u) { return `mj_g${g}_u${u}`; }
function getBest(g, u) { const v = localStorage.getItem(bKey(g, u)); return v !== null ? parseInt(v) : null; }
function saveBest(g, u, m) { const cur = getBest(g, u); if (cur === null || m < cur) localStorage.setItem(bKey(g, u), m); }
</script>
