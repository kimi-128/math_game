<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 게임 모음</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #fff8e1 0%, #e8f5e9 45%, #e3f2fd 100%);
  min-height: 100vh;
  font-family: 'Malgun Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  user-select: none;
}

.hub-title {
  font-size: 2.4rem;
  font-weight: 900;
  color: #37474f;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-align: center;
}

.hub-sub {
  font-size: 0.95rem;
  color: #90a4ae;
  margin-bottom: 44px;
  text-align: center;
}

.game-grid {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  justify-content: center;
}

.game-card {
  width: 240px;
  border-radius: 24px;
  padding: 32px 24px 28px;
  text-align: center;
  text-decoration: none;
  color: inherit;
  transition: transform .22s, box-shadow .22s;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.game-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.4) 0%, transparent 70%);
  pointer-events: none;
}

.game-card:hover {
  transform: translateY(-10px);
}

/* 지렁이 카드 */
.card-snake {
  background: linear-gradient(145deg, #c8e6c9, #a5d6a7);
  border: 2px solid #81c784;
  box-shadow: 0 8px 30px rgba(76,175,80,.25);
}
.card-snake:hover {
  box-shadow: 0 16px 48px rgba(76,175,80,.42);
}

/* 테트리스 카드 */
.card-tetris {
  background: linear-gradient(145deg, #bbdefb, #90caf9);
  border: 2px solid #64b5f6;
  box-shadow: 0 8px 30px rgba(33,150,243,.25);
}
.card-tetris:hover {
  box-shadow: 0 16px 48px rgba(33,150,243,.42);
}


.card-icon {
  font-size: 3.8rem;
  margin-bottom: 16px;
  display: block;
}

.card-title {
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 10px;
}

.card-snake  .card-title { color: #2e7d32; }
.card-tetris .card-title { color: #1565c0; }

.card-desc {
  font-size: 0.84rem;
  line-height: 1.7;
  margin-bottom: 22px;
}

.card-snake  .card-desc { color: #388e3c; }
.card-tetris .card-desc { color: #1976d2; }

.play-btn {
  display: inline-block;
  padding: 10px 30px;
  border-radius: 24px;
  font-size: 1rem;
  font-weight: bold;
  transition: transform .15s, opacity .15s;
}

.game-card:hover .play-btn { transform: scale(1.07); }

.card-snake  .play-btn { background: #2e7d32; color: #fff; box-shadow: 0 4px 14px rgba(46,125,50,.35); }
.card-tetris .play-btn { background: #1565c0; color: #fff; box-shadow: 0 4px 14px rgba(21,101,192,.35); }

.badge {
  position: absolute;
  top: 14px; right: 16px;
  font-size: 0.7rem;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 10px;
}
.card-snake  .badge { background: rgba(46,125,50,.15);  color: #2e7d32; }
.card-tetris .badge { background: rgba(21,101,192,.15); color: #1565c0; }

/* 하단 안내 */
.hint {
  margin-top: 40px;
  font-size: 0.78rem;
  color: #b0bec5;
  text-align: center;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="hub-title">🎮 게임 모음</div>
<div class="hub-sub">즐기고 싶은 게임을 선택하세요!</div>

<div class="game-grid">

  <a class="game-card card-snake" href="snake_game.html">
    <span class="badge">1인용</span>
    <span class="card-icon">🐍</span>
    <div class="card-title">지렁이 게임</div>
    <div class="card-desc">
      먹이를 먹으면 몸이 길어져요.<br>
      벽과 몸통을 피해<br>
      최고 기록에 도전하세요!
    </div>
    <span class="play-btn">▶ 플레이</span>
  </a>

  <a class="game-card card-tetris" href="tetris_game.html">
    <span class="badge">이름 등록</span>
    <span class="card-icon">🧩</span>
    <div class="card-title">테트리스</div>
    <div class="card-desc">
      블록을 쌓아 줄을 없애요.<br>
      이름을 등록하고<br>
      친구와 기록을 겨뤄보세요!
    </div>
    <span class="play-btn">▶ 플레이</span>
  </a>


</div>

<div class="hint">
  키보드 방향키 / WASD · 모바일 터치 지원
</div>

</body>
</html>
